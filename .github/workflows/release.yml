name: Release
on:
  push:
    tags: ['[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]*'] # the day of the release, 2026-10-22, or 2026-10-22.2 for a second one
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            goos: darwin
            goarch: arm64
            name: macos-arm64
          - os: macos-13
            goos: darwin
            goarch: amd64
            name: macos-x64
          - os: windows-latest
            goos: windows
            goarch: amd64
            name: windows-x64
          - os: ubuntu-22.04
            goos: linux
            goarch: amd64
            name: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Linux build dependencies
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Build frontend
        run: cd frontend && npm ci && npm run build
      - name: Version
        id: ver
        shell: bash
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
      - name: Build (unix)
        if: matrix.goos != 'windows'
        shell: bash
        run: |
          mkdir -p dist
          go build -ldflags "-s -w -X main.version=${{ steps.ver.outputs.version }}" -o dist/wordprojector ./cmd/wordprojector
      - name: Build (windows)
        if: matrix.goos == 'windows'
        shell: bash
        run: |
          mkdir -p dist
          go build -ldflags "-s -w -H windowsgui -X main.version=${{ steps.ver.outputs.version }}" -o dist/WordProjector.exe ./cmd/wordprojector
      - name: Package macOS
        if: matrix.goos == 'darwin'
        shell: bash
        run: |
          ./build/mac-app.sh dist/wordprojector dist/WordProjector.app ${{ steps.ver.outputs.version }}
          codesign --force --deep --sign - dist/WordProjector.app || true
          cd dist && ditto -c -k --keepParent WordProjector.app WordProjector-${{ steps.ver.outputs.version }}-${{ matrix.name }}.zip
      - name: Package Windows
        if: matrix.goos == 'windows'
        shell: pwsh
        run: |
          Copy-Item LICENSE dist/LICENSE.txt
          Compress-Archive -Path dist/WordProjector.exe, dist/LICENSE.txt -DestinationPath dist/WordProjector-${{ steps.ver.outputs.version }}-${{ matrix.name }}.zip
      - name: Package Linux
        if: matrix.goos == 'linux'
        shell: bash
        run: |
          mkdir -p pkg/WordProjector
          cp dist/wordprojector pkg/WordProjector/WordProjector
          cp LICENSE pkg/WordProjector/
          cp build/icon.png pkg/WordProjector/
          cp build/linux/wordprojector.desktop build/linux/README-linux.txt pkg/WordProjector/
          tar -C pkg -czf dist/WordProjector-${{ steps.ver.outputs.version }}-${{ matrix.name }}.tar.gz WordProjector
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            dist/*.zip
            dist/*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: cd artifacts && sha256sum * > checksums.txt # the program checks its downloads against this file
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          body: |
            Standalone builds. No installation or extra dependencies are required:

            * **macOS**: unzip and move `WordProjector.app` to Applications. The app is not notarized; on first start right-click → Open (or run `xattr -cr WordProjector.app`).
            * **Windows**: unzip and run `WordProjector.exe` (Windows 10/11 ship the required WebView2 runtime).
            * **Linux**: untar and run `./WordProjector` (needs the system WebKitGTK 4.1 library, present on most desktops: `libwebkit2gtk-4.1-0`).

            Your data (database, downloaded modules) is stored in the per-user application data folder. An existing SoftProjector `spData.sqlite` can be copied there or placed next to the executable.
