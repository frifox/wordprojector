name: Release
on:
  push:
    tags: ['[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]*'] # the day of the release, 2026-10-22, or 2026-10-22.2 for a second one
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            goos: darwin
            goarch: arm64
            name: macos-arm64
          - os: macos-14 # the Intel build is cross-compiled here (the macos-13 runners are gone)
            goos: darwin
            goarch: amd64
            name: macos-x64
          - os: windows-latest
            goos: windows
            goarch: amd64
            name: windows-x64
          - os: windows-latest # the ARM build is cross-compiled here: the program needs no C compiler on Windows
            goos: windows
            goarch: arm64
            name: windows-arm64
          - os: ubuntu-22.04
            goos: linux
            goarch: amd64
            name: linux-x64
          - os: ubuntu-22.04-arm # native; also a Raspberry Pi 3, 4 or 5 with a 64-bit system (built on 22.04 to run on older systems)
            goos: linux
            goarch: arm64
            name: linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Linux build dependencies
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Build frontend
        run: cd frontend && npm ci && npm run build
      - name: Version
        id: ver
        shell: bash
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
      - name: Build (unix)
        if: matrix.goos != 'windows'
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '1'
          # the Linux window uses GTK 3 and WebKitGTK 4.1 (libwebkit2gtk-4.1)
          TAGS: ${{ matrix.goos == 'linux' && 'gtk3' || '' }}
          # macOS: the C parts target the oldest macOS the program supports
          CGO_CFLAGS: ${{ matrix.goos == 'darwin' && '-mmacosx-version-min=11.0' || '' }}
          CGO_LDFLAGS: ${{ matrix.goos == 'darwin' && '-mmacosx-version-min=11.0' || '' }}
        run: |
          mkdir -p dist
          go build -tags "$TAGS" -ldflags "-s -w -X main.version=${{ steps.ver.outputs.version }} -X main.commit=${{ github.sha }}" -o dist/wordprojector ./cmd/wordprojector
      - name: Build (windows)
        if: matrix.goos == 'windows'
        shell: bash
        env:
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          go build -ldflags "-s -w -H windowsgui -X main.version=${{ steps.ver.outputs.version }} -X main.commit=${{ github.sha }}" -o dist/WordProjector.exe ./cmd/wordprojector
      - name: Package macOS
        if: matrix.goos == 'darwin'
        shell: bash
        # signed with the Developer ID certificate and notarized by Apple when the secrets are set; without them the app is only
        # signed ad hoc and users have to allow it in the system settings
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}  # the "Developer ID Application" certificate with its key (.p12), base64
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}    # the App Store Connect API key (.p8), base64
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          ZIP: dist/WordProjector-${{ steps.ver.outputs.version }}-${{ matrix.name }}.zip
        run: |
          set -euo pipefail
          APP="dist/Word Projector.app" # with the space: that is the name of the app in Finder and Applications
          ./build/mac-app.sh dist/wordprojector "$APP" ${{ steps.ver.outputs.version }}
          if [ -z "${MACOS_CERT_P12_BASE64:-}" ]; then
            echo "no certificate set: signing ad hoc (not notarized)"
            codesign --force --deep --sign - "$APP" || true
            ditto -c -k --keepParent "$APP" "$ZIP"
            exit 0
          fi
          # a keychain of its own, holding the certificate only while this runs
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KCPASS="$(uuidgen)"
          security create-keychain -p "$KCPASS" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KCPASS" "$KEYCHAIN"
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security > /dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPASS" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | grep "Developer ID Application" | head -1 | sed -E 's/^[^"]*"(.*)".*$/\1/' || true)"
          [ -n "$IDENTITY" ] || { echo 'no "Developer ID Application" certificate in the .p12'; exit 1; }
          echo "signing as $IDENTITY"
          # hardened runtime and a secure timestamp: Apple's notarization wants both
          codesign --force --deep --options runtime --timestamp --sign "$IDENTITY" "$APP"
          codesign --verify --strict --verbose=2 "$APP"
          # Apple scans the app (a few minutes) and answers Accepted or Invalid
          echo "$NOTARY_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/key.p8"
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/notarize.zip"
          RESULT="$(xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --key "$RUNNER_TEMP/key.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" --wait --output-format json)"
          echo "$RESULT"
          STATUS="$(echo "$RESULT" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("status",""))')"
          if [ "$STATUS" != "Accepted" ]; then
            ID="$(echo "$RESULT" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("id",""))')"
            [ -n "$ID" ] && xcrun notarytool log "$ID" --key "$RUNNER_TEMP/key.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" || true
            echo "notarization status is \"$STATUS\""
            exit 1
          fi
          # the ticket goes into the app, so it is accepted without a network too
          xcrun stapler staple "$APP"
          spctl --assess --type execute --verbose=2 "$APP"
          ditto -c -k --keepParent "$APP" "$ZIP"
          security delete-keychain "$KEYCHAIN" || true
      - name: Package Windows
        if: matrix.goos == 'windows'
        shell: pwsh
        run: |
          Copy-Item LICENSE dist/LICENSE.txt
          Compress-Archive -Path dist/WordProjector.exe, dist/LICENSE.txt -DestinationPath dist/WordProjector-${{ steps.ver.outputs.version }}-${{ matrix.name }}.zip
      - name: Package Linux
        if: matrix.goos == 'linux'
        shell: bash
        run: |
          mkdir -p pkg/WordProjector
          cp dist/wordprojector pkg/WordProjector/WordProjector
          cp LICENSE pkg/WordProjector/
          cp build/icon.png pkg/WordProjector/
          cp build/linux/wordprojector.desktop build/linux/README-linux.txt pkg/WordProjector/
          tar -C pkg -czf dist/WordProjector-${{ steps.ver.outputs.version }}-${{ matrix.name }}.tar.gz WordProjector
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: |
            dist/*.zip
            dist/*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: cd artifacts && sha256sum * > checksums.txt # the program checks its downloads against this file
      - name: Release notes
        # the summary of the changes is the message of the (annotated) tag: git tag -a <tag> -m "<summary>"
        run: |
          git fetch --tags --force origin
          git for-each-ref "${GITHUB_REF}" --format='%(contents)' > notes.md
          [ -s notes.md ] && printf '\n\n' >> notes.md
          # the link GitHub puts at the bottom of its own notes: every change since the previous release
          prev=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          if [ -n "$prev" ]; then
            printf '\n**Full Changelog**: https://github.com/%s/compare/%s...%s\n' "${GITHUB_REPOSITORY}" "$prev" "${GITHUB_REF_NAME}" >> notes.md
          fi
      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          body_path: notes.md
