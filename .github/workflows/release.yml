name: Release
on:
  push:
    tags: ['[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9]*'] # the day of the release, 2026.10.22, or 2026.10.22.2 for a second one
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            goos: darwin
            goarch: arm64
            name: macos-arm64
          - os: macos-14 # the Intel build is cross-compiled here (the macos-13 runners are gone)
            goos: darwin
            goarch: amd64
            name: macos-x64
          - os: windows-latest
            goos: windows
            goarch: amd64
            name: windows-x64
          - os: windows-latest # the ARM build is cross-compiled here: the program needs no C compiler on Windows
            goos: windows
            goarch: arm64
            name: windows-arm64
          - os: ubuntu-22.04
            goos: linux
            goarch: amd64
            name: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Linux build dependencies
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Build frontend
        run: cd frontend && npm ci && npm run build
      - name: Version
        id: ver
        shell: bash
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
      - name: Build (unix)
        if: matrix.goos != 'windows'
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '1'
          # the Linux window uses GTK 3 and WebKitGTK 4.1 (libwebkit2gtk-4.1)
          TAGS: ${{ matrix.goos == 'linux' && 'gtk3' || '' }}
          # macOS: the C parts target the oldest macOS the program supports
          CGO_CFLAGS: ${{ matrix.goos == 'darwin' && '-mmacosx-version-min=11.0' || '' }}
          CGO_LDFLAGS: ${{ matrix.goos == 'darwin' && '-mmacosx-version-min=11.0' || '' }}
        run: |
          mkdir -p dist
          go build -tags "$TAGS" -ldflags "-s -w -X main.version=${{ steps.ver.outputs.version }}" -o dist/wordprojector ./cmd/wordprojector
      - name: Build (windows)
        if: matrix.goos == 'windows'
        shell: bash
        env:
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          go build -ldflags "-s -w -H windowsgui -X main.version=${{ steps.ver.outputs.version }}" -o dist/WordProjector.exe ./cmd/wordprojector
      - name: Package macOS
        if: matrix.goos == 'darwin'
        shell: bash
        run: |
          ./build/mac-app.sh dist/wordprojector dist/WordProjector.app ${{ steps.ver.outputs.version }}
          codesign --force --deep --sign - dist/WordProjector.app || true
          cd dist && ditto -c -k --keepParent WordProjector.app WordProjector-${{ steps.ver.outputs.version }}-${{ matrix.name }}.zip
      - name: Package Windows
        if: matrix.goos == 'windows'
        shell: pwsh
        run: |
          Copy-Item LICENSE dist/LICENSE.txt
          Compress-Archive -Path dist/WordProjector.exe, dist/LICENSE.txt -DestinationPath dist/WordProjector-${{ steps.ver.outputs.version }}-${{ matrix.name }}.zip
      - name: Package Linux
        if: matrix.goos == 'linux'
        shell: bash
        run: |
          mkdir -p pkg/WordProjector
          cp dist/wordprojector pkg/WordProjector/WordProjector
          cp LICENSE pkg/WordProjector/
          cp build/icon.png pkg/WordProjector/
          cp build/linux/wordprojector.desktop build/linux/README-linux.txt pkg/WordProjector/
          tar -C pkg -czf dist/WordProjector-${{ steps.ver.outputs.version }}-${{ matrix.name }}.tar.gz WordProjector
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            dist/*.zip
            dist/*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: cd artifacts && sha256sum * > checksums.txt # the program checks its downloads against this file
      - name: Release notes
        # the summary of the changes is the message of the (annotated) tag: git tag -a <tag> -m "<summary>"
        run: |
          git fetch --tags --force origin
          git for-each-ref "${GITHUB_REF}" --format='%(contents)' > notes.md
          [ -s notes.md ] && printf '\n\n' >> notes.md
          cat >> notes.md <<'EOF'
          Standalone builds. No installation or extra dependencies are required:

          * **macOS**: unzip and move `WordProjector.app` to Applications. The app is not notarized; on first start right-click → Open (or run `xattr -cr WordProjector.app`).
          * **Windows**: unzip and run `WordProjector.exe`, from the x64 or the arm64 archive to match your PC (Windows 10/11 ship the required WebView2 runtime).
          * **Linux**: untar and run `./WordProjector` (needs the system WebKitGTK 4.1 library, present on most desktops: `libwebkit2gtk-4.1-0`).

          Your data (database, downloaded modules) is stored in the per-user application data folder. For a portable copy put `wordprojector.sqlite` next to the executable.
          EOF
          # the link GitHub puts at the bottom of its own notes: every change since the previous release
          prev=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          if [ -n "$prev" ]; then
            printf '\n**Full Changelog**: https://github.com/%s/compare/%s...%s\n' "${GITHUB_REPOSITORY}" "$prev" "${GITHUB_REF_NAME}" >> notes.md
          fi
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          body_path: notes.md
