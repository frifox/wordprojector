<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Word Projector</title>
    <script>
      // a display window must never flash white while its page loads
      if (/^\/projector\//.test(location.pathname)) document.documentElement.style.background = '#000';
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
